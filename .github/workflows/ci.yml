name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings

  test-stable:
    name: test (stable, full)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # 全量：功能 + 回归 + trybuild UI 快照 + doctest
      - run: cargo test

  test-msrv:
    name: test (MSRV 1.95, functional)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
      # MSRV 只跑功能/回归 + doctest，跳过 trybuild 快照（.stderr 措辞随 rustc 漂移）
      # tests/dsl.rs 是拆分后的测试 crate 入口（mod features; 挂载 tests/features/ 全部模块）
      - run: cargo test --lib --test dsl
      - run: cargo test --doc

  test-windows:
    name: test (Windows, functional)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Windows/MSVC：链接产物通知（linker_messages）与路径分隔符是平台特有面，
      # 功能/回归 + doctest 覆盖它；trybuild UI 快照的 .stderr 措辞跨平台漂移，跳过
      - run: cargo test --lib --test dsl
      - run: cargo test --doc

  doc:
    name: doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --no-deps
