[permissions]
allow = ["Bash=$dir = Join-Path $env:TEMP \"attr-order-probe\"; if (Test-Path $dir) { Remove-Item -Recurse -Force $dir }; cargo new $dir --lib --edition 2024 2>&1 | Select-Object -Last 2; Write-Output $dir", "Bash=$d = \"C:\\Users\\yanho\\AppData\\Local\\Temp\\attr-order-probe\"\n@'\n[package]\nname = \"attr-order-probe\"\nversion = \"0.1.0\"\nedition = \"2024\"\n\n[lib]\nproc-macro = true\n\n[dependencies]\nproc-macro2 = \"1\"\nquote = \"1\"\n'@ | Set-Content -Path \"$d\\Cargo.toml\" -Encoding utf8\n@'\nuse proc_macro::TokenStream;\n\n/// help 宏：打印自己的 attr 与整个 item（含其他属性），\n/// 然后把 item 中 `#[probe::consume(...)]` 的属性参数里的 `@nums` 替换为 `[u8, u16]`，\n/// 原样输出（验证\"改写下游属性并保留 item\"）。\n#[proc_macro_attribute]\npub fn help(attr: TokenStream, item: TokenStream) -> TokenStream {\n    eprintln!(\">>> [HELP]    attr = {attr}\");\n    let s = item.to_string();\n    eprintln!(\">>> [HELP]    item 前 300 字符 = {}\", s.chars().take(300).collect::<String>());\n    // 字符串级替换做探针（真实实现应在 token 级做，这里只验证机制可行性）\n    let s2 = s.replace(\"@nums\", \"[u8, u16]\");\n    s2.parse().unwrap()\n}\n\n/// consume 宏：打印自己收到的 attr（验证 help 是否已先展开并改写）。\n#[proc_macro_attribute]\npub fn consume(attr: TokenStream, item: TokenStream) -> TokenStream {\n    eprintln!(\">>> [CONSUME] attr = {attr}\");\n    item\n}\n'@ | Set-Content -Path \"$d\\src\\lib.rs\" -Encoding utf8\nNew-Item -ItemType Directory -Force -Path \"$d\\tests\" | Out-Null\n@'\n#[attr_order_probe::help(HELP_ATTR)]\n#[attr_order_probe::consume(@nums#zero{0})]\ntrait A {\n    fn zero() -> Self;\n}\n'@ | Set-Content -Path \"$d\\tests\\probe.rs\" -Encoding utf8\nGet-Content \"$d\\tests\\probe.rs\"", "Bash=$d = \"C:\\Users\\yanho\\AppData\\Local\\Temp\\attr-order-probe\"\n# 实验 A：只有 consume，无 help —— @nums 直接出现在宏属性参数里\n@'\n#[attr_order_probe::consume(@nums#zero{0})]\ntrait A {\n    fn zero() -> Self;\n}\n'@ | Set-Content -Path \"$d\\tests\\probe_b.rs\" -Encoding utf8\nWrite-Output \"===== 实验 B：只留 consume（@nums 直接进宏参数）=====\"\ncd $d; cargo test --test probe_b 2>&1 | Select-String -Pattern \"HELP|CONSUME|error|warning\" | Select-Object -First 10", "Bash=$c = (git rev-list --count HEAD); $l = (git log --format=\"%an\" | Sort-Object -Unique); Write-Output \"commits: $c\"; Write-Output \"authors:\"; $l; Write-Output \"---line counts (src+tests+docs)---\"; (Get-ChildItem src,tests -Recurse -Include *.rs | Get-Content | Measure-Object -Line).Lines; Write-Output \"---first commit---\"; git log --reverse --format=\"%h %ad %s\" --date=short | Select-Object -First 3", "Bash=$dir = Join-Path $env:TEMP \"batch_impl_probe\"; Remove-Item -Recurse -Force $dir -ErrorAction SilentlyContinue; New-Item -ItemType Directory -Path (Join-Path $dir \"examples\") -Force | Out-Null;\n@'\n[package]\nname = \"batch-impl-probe\"\nversion = \"0.1.0\"\nedition = \"2024\"\n\n[dependencies]\nbatch-impl = { path = \"D:\\CS\\Rust\\macro-test\" }\n'@ | Set-Content (Join-Path $dir \"Cargo.toml\") -Encoding UTF8;\n@'\nuse batch_impl::batch_impl;\n\n// A: `-` 写法（官方等价、文档示例形态），预期成功\n#[batch_impl(fn^(A,B)-C)]\ntrait FnDash {}\n\n// B: `->` 写法，应与 A 行为一致\n#[batch_impl(fn^(A,B)->C)]\ntrait FnArrow {}\n'@ | Set-Content (Join-Path $dir \"examples\\e1_arrow.rs\") -Encoding UTF8;\n@'\nuse batch_impl::batch_impl;\n\ntrait NewT { fn new() -> Self; }\n\n#[batch_impl(#blanket(@all_static_methods){Box})]\ntrait NewT { fn new() -> Self; }\n'@ | Set-Content (Join-Path $dir \"examples\\e2_blanket_new.rs\") -Encoding UTF8;\n@'\nuse batch_impl::batch_impl;\n\n// 文档声明的合法输入：`(<Clone>)^N` 受限元组\n#[batch_impl((<Clone>)^2)]\ntrait Foo {}\n'@ | Set-Content (Join-Path $dir \"examples\\e3_group_pow.rs\") -Encoding UTF8;\n@'\nuse batch_impl::batch_impl;\n\n// where 谓词 T::Item: Clone 引用参数 T；impl 泛型改名 U 时应报错（参照 rename_where 模式）\n#[batch_impl(<U> A<U> ())]\ntrait A<T> where T::Item: Clone {}\n'@ | Set-Content (Join-Path $dir \"examples\\e4_titem_ref.rs\") -Encoding UTF8;\nWrite-Output \"scaffold ready: $dir\"; Get-ChildItem -Recurse $dir | Select-Object FullName", "Bash=$dir = Join-Path $env:TEMP \"batch_impl_probe\"; Set-Location $dir; Write-Output \"===== e1_arrow: fn^(A,B)-C vs fn^(A,B)->C =====\"; cargo check --example e1_arrow 2>&1 | Select-String -Pattern \"error|warning: unused\" | Select-Object -First 12", "Bash=$dir = Join-Path $env:TEMP \"batch_impl_probe\"; Write-Output \"===== file content =====\"; Get-Content (Join-Path $dir \"examples\\e1_arrow.rs\"); Write-Output \"===== raw bytes (first 200) =====\"; [System.IO.File]::ReadAllBytes((Join-Path $dir \"examples\\e1_arrow.rs\"))[0..199] -join ' '", "Bash=$dir = Join-Path $env:TEMP \"batch_impl_probe\"; Set-Location $dir; cargo check --example e1_arrow 2>&1 | Out-String", "Bash=$dir = Join-Path $env:TEMP \"batch_impl_probe\"; (Get-Content (Join-Path $dir \"Cargo.toml\")) -replace 'D:\\\\CS\\\\Rust\\\\macro-test', 'D:/CS/Rust/macro-test' | Set-Content (Join-Path $dir \"Cargo.toml\") -Encoding UTF8; Write-Output \"===== e1_arrow =====\"; Set-Location $dir; cargo check --example e1_arrow 2>&1 | Out-String", "Bash=$dir = Join-Path $env:TEMP \"batch_impl_probe\"; Set-Location $dir; Write-Output \"===== e2_blanket_new =====\"; cargo check --example e2_blanket_new 2>&1 | Select-String -Pattern \"error|-->\" | Select-Object -First 8; Write-Output \"\"; Write-Output \"===== e3_group_pow =====\"; cargo check --example e3_group_pow 2>&1 | Select-String -Pattern \"error|-->\" | Select-Object -First 8; Write-Output \"\"; Write-Output \"===== e4_titem_ref =====\"; cargo check --example e4_titem_ref 2>&1 | Select-String -Pattern \"error|-->\" | Select-Object -First 8", "Bash=$dir = Join-Path $env:TEMP \"batch_impl_probe\";\n@'\nuse batch_impl::batch_impl;\n\n#[batch_impl(#blanket(@all_static_methods){Box})]\ntrait NewT { fn new() -> Self; }\n'@ | Set-Content (Join-Path $dir \"examples\\e2_blanket_new.rs\") -Encoding UTF8;\n@'\nuse batch_impl::batch_impl;\n\n// 对照组 A：带逗号形式（tutorial 声明的受限元组），预期成功\n#[batch_impl((<Clone>,)^2)]\ntrait FooComma {}\n\n// 对照组 B：无逗号形式，应与 A 行为一致\n#[batch_impl((<Clone>)^2)]\ntrait FooBare {}\n'@ | Set-Content (Join-Path $dir \"examples\\e3_group_pow.rs\") -Encoding UTF8;\nWrite-Output \"===== e2 (clean) =====\"; cargo check --example e2_blanket_new 2>&1 | Select-String -Pattern \"error|-->\" | Select-Object -First 6; Write-Output \"\"; Write-Output \"===== e3 (with control) =====\"; cargo check --example e3_group_pow 2>&1 | Select-String -Pattern \"error|-->\" | Select-Object -First 8", "Bash=$dir = Join-Path $env:TEMP \"batch_impl_probe\"; Get-ChildItem (Join-Path $dir \"examples\") | Select-Object Name, Length; Write-Output \"---\"; Get-Content (Join-Path $dir \"examples\\e2_blanket_new.rs\")", "Bash=$dir = Join-Path $env:TEMP \"batch_impl_probe\"; Set-Location $dir; Write-Output \"===== e2 (clean) =====\"; cargo check --example e2_blanket_new 2>&1 | Select-String -Pattern \"error|-->\" | Select-Object -First 6; Write-Output \"\"; Write-Output \"===== e3 (with control) =====\"; cargo check --example e3_group_pow 2>&1 | Select-String -Pattern \"error|-->\" | Select-Object -First 8", "Bash=$dir = Join-Path $env:TEMP \"batch_impl_probe\";\n@'\nuse batch_impl::batch_impl;\n\nstruct Inner;\nimpl Inner {\n    fn f(self: Box<Self>, x: u32) -> u32 { x }\n}\n\nstruct Wrap(Box<Inner>);\n\n// 委托目标 self.0 是 Box<Inner>，与 f 的 typed receiver Box<Self> 匹配；\n// 正确转发应只传 x，实际实现会把 self 也当位置参数转发\n#[batch_impl(Wrap #delegate(f){self.0})]\ntrait HasF { fn f(self: Box<Self>, x: u32) -> u32; }\n'@ | Set-Content (Join-Path $dir \"examples\\e5_typed_receiver.rs\") -Encoding UTF8;\nSet-Location $dir; cargo check --example e5_typed_receiver 2>&1 | Select-String -Pattern \"error\" | Select-Object -First 6", "Bash=$dir = Join-Path $env:TEMP \"batch_impl_probe\";\n@'\nuse batch_impl::batch_impl;\n\n// 对照组：fn(A) -> B 单独写，预期成功\n#[batch_impl(fn(A) -> B)]\ntrait FnRetOk {}\n\n// 意图 (fn(A)->B) - C（- 是 DSL 左结合算子）；预期：报错或正确解出，\n// 实际：静默把 \"B - C\" 整个吞成返回类型 primitive\n#[batch_impl(fn(A) -> B - C)]\ntrait FnRetDash {}\n'@ | Set-Content (Join-Path $dir \"examples\\e7_fn_return.rs\") -Encoding UTF8;\n@'\nuse batch_impl::batch_impl;\n\n// `;` 是段边界 token，出现在 spec 中间应报错；预期：指导性错误\n// 实际：静默吞入 primitive，输出 impl ... for A < B ; C > 无效 Rust\n#[batch_impl(A^B; C)]\ntrait SemiBoundary {}\n'@ | Set-Content (Join-Path $dir \"examples\\e6_semi.rs\") -Encoding UTF8;\nSet-Location $dir; Write-Output \"===== e6_semi =====\"; cargo check --example e6_semi 2>&1 | Select-String -Pattern \"error\" | Select-Object -First 5; Write-Output \"\"; Write-Output \"===== e7_fn_return =====\"; cargo check --example e7_fn_return 2>&1 | Select-String -Pattern \"error\" | Select-Object -First 6"]
