[package]
name = "batch-impl"
version = "0.10.0"
edition = "2024"
authors = ["5-6-1"]
description = "A proc-macro library for batch generating trait impls with a powerful DSL"
license = "MIT OR Apache-2.0"
repository = "https://github.com/5-6-1/batch-impl-rs"
homepage = "https://github.com/5-6-1/batch-impl-rs"
documentation = "https://docs.rs/batch-impl"
readme = "README.md"
keywords = ["macro", "trait", "impl", "batch", "codegen"]
categories = ["development-tools::procedural-macro-helpers"]
rust-version = "1.95.0"
# Excluded from the published `.crate`:
# - `rustfmt.toml` / `.github/` / `proptest-regressions/`: repo tooling.
# - `rust-2024-feature.md`: local notes (lesson: it once shipped in every crate).
# - `docs/zh-CN/` + `docs/dev-changelog.md`: development artifacts (the zh
#   mirrors and the internal changelog). The build only reads `README.md`,
#   `docs/tutorial.md`, `docs/reference.md` and `src/doc/*.md` via `include_str!`.
# - `tests/`: the suite is developed here, not shipped. It has to go together
#   with the docs above — `tests/doc_consistency.rs` reads `docs/zh-CN/…` and
#   resolves every path the current-state docs name (including
#   `docs/dev-changelog.md`), so a crate that shipped the tests without those
#   docs would contain a suite that fails. `cargo package` only *builds*, so it
#   cannot catch that; excluding both keeps the published crate self-consistent.
exclude = [
    "rustfmt.toml",
    ".github/",
    "proptest-regressions/",
    "rust-2024-feature.md",
    "docs/zh-CN/",
    "docs/dev-changelog.md",
    "tests/",
]

[lib]
proc-macro = true
# README and the included tutorials/API examples run as doctests, including
# the open-extension protocol examples. Some topic snippets use hidden setup
# lines; preview examples use `compile_fail` because their output is a diagnostic.

[dependencies]
syn = { version = "3", features = ["full", "visit"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"

[dev-dependencies]
trybuild = "1.0.118"
proptest = "1"

# The MSVC linker prints "creating library ... and object ..." to stdout,
# which rustc treats as `linker_messages` warnings (a Rust 2024
# warn-by-default lint, deliberately outside the `warnings` group). These
# are harmless Windows link-product notices; suppressed for every target
# (lib/tests/...), not just the crate root.
[lints.rust]
linker_messages = "allow"
